# Publishes the Business Advisor app (business-advisor/public) to GitHub Pages,
# with the Phnom Penh 3D map at /phnom-penh-3d/.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
# The app will be at https://<owner>.github.io/<repo>/
name: Publish Business Advisor

on:
  push:
    branches: [claude/build-consulting-website-jrobo] # the repository's default branch
    paths: ['business-advisor/public/**', 'phnom-penh-3d/**', '.github/workflows/business-advisor-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true # turns on GitHub Pages the first time
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r business-advisor/public/. _site/
          cp -r phnom-penh-3d _site/phnom-penh-3d
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
