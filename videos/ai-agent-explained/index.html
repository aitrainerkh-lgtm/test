    <style>
      @font-face { font-family: 'Space Grotesk'; src: url('assets/fonts/SpaceGrotesk.ttf') format('truetype'); font-weight: 300 700; }
      @font-face { font-family: 'Inter'; src: url('assets/fonts/Inter.ttf') format('truetype'); font-weight: 100 900; }
      @font-face { font-family: 'JetBrains Mono'; src: url('assets/fonts/JetBrainsMono.ttf') format('truetype'); font-weight: 100 800; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #F2F4F3; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #F2F4F3; font-family: 'Inter', sans-serif; }
      [data-composition-id="root"] > div[data-composition-src] { position: absolute; inset: 0; }
      /* shared world background — not a clip, lives for the whole film */
      #world-bg { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(180deg, #F6F8F7 0%, #EEF1F0 100%); }
      #world-dots { position: absolute; left: -80px; top: -80px; width: 2080px; height: 1240px; opacity: .55;

      #world-blob-g { position: absolute; left: -260px; top: -320px; width: 1100px; height: 1100px; border-radius: 50%;
        background: radial-gradient(circle, rgba(51,194,122,.20) 0%, rgba(51,194,122,0) 62%); }
      #world-blob-o { position: absolute; left: 1150px; top: 520px; width: 1000px; height: 1000px; border-radius: 50%;
        background: radial-gradient(circle, rgba(240,131,42,.15) 0%, rgba(240,131,42,0) 62%); }
      #world-vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(255,255,255,0) 55%, rgba(30,40,35,.10) 100%); }
    </style>
  </head>

    <script>
      const tl = gsap.timeline({ paused: true });
      // slow, continuous drift of the shared world so cuts never land on a frozen background
      tl.fromTo('#world-dots', { x: 0, y: 0 }, { x: -60, y: -40, duration: 61.5, ease: 'none' }, 0);
      tl.fromTo('#world-blob-g', { x: 0, y: 0, scale: 1 }, { x: 420, y: 180, scale: 1.15, duration: 61.5, ease: 'sine.inOut' }, 0);
      tl.fromTo('#world-blob-o', { x: 0, y: 0, scale: 1 }, { x: -520, y: -260, scale: 1.1, duration: 61.5, ease: 'sine.inOut' }, 0);
      window.__timelines['root'] = tl;
