<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: 'Space Grotesk'; src: url('assets/fonts/SpaceGrotesk.ttf') format('truetype'); font-weight: 300 700; }
        #s7 { position: absolute; inset: 0; overflow: hidden; }
        #s7-cam { position: absolute; inset: 0; transform-origin: 960px 540px; }
        #s7-video { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
        #s7-wash { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(242,244,243,.55) 0%, rgba(242,244,243,.18) 45%, rgba(242,244,243,0) 60%); }
        #s7-ttl { position: absolute; left: 150px; top: 96px; font-size: 92px; }
        #s7-ttl .ac { color: #1E9E58; }
        #s7-approve { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #fff; font: 700 22px 'Inter', sans-serif; }
        #s7-rip { position: absolute; left: 0; top: 0; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; border: 4px solid #1E9E58; opacity: 0; }
        #s7-glow { position: absolute; left: 110px; top: 190px; width: 680px; height: 720px; border-radius: 40px; background: radial-gradient(ellipse at center, rgba(51,194,122,.35), rgba(51,194,122,0) 70%); opacity: 0; }
      </style>

      <div id="s7" data-composition-id="s7-review" data-width="1920" data-height="1080" data-duration="6.48" class="af">
        <div id="s7-cam">
          <video id="s7-video" class="clip" src="assets/media/manager.mp4" data-start="0" data-duration="6.48" data-media-start="1.5" data-track-index="2" muted playsinline></video>
          <div id="s7-wash"></div>
          <div id="s7-glow"></div>
          <div id="s7-cardwrap" data-layout-allow-overlap></div>
          <div id="s7-ttl" class="kt"><span class="wmask"><span class="w s7-tw">HUMAN</span></span><span class="wsp">&nbsp;</span><span class="wmask"><span class="w s7-tw ac">REVIEW</span></span></div>
          <div id="s7-rip"></div>
          <div id="s7-curw" data-layout-allow-overlap></div>
        </div>
      </div>

      <script>
        (function () {
          document.getElementById('s7-cardwrap').innerHTML = AF.reviewCard('s7c');
          document.getElementById('s7-curw').innerHTML = AF.cursor('s7-cur', '#1D2125', 'Manager');
          // scene-7-only: the un-approved button label
          const btn = document.getElementById('s7c-btn');
          const ap = document.createElement('span'); ap.id = 's7-approve'; ap.textContent = 'Approve'; btn.appendChild(ap);

          function build() {
            const tl = gsap.timeline({ paused: true });
            tl.fromTo('#s7-cam', { scale: 1 }, { scale: 1.05, duration: 6.48, ease: 'sine.inOut' }, 0);
            tl.fromTo('#s7-wash', { opacity: 0 }, { opacity: 1, duration: 0.6 }, 0);

            // the result card arrives from scene 6 and grows into the review panel
            tl.fromTo('#s7c', { x: 120, y: 70, width: 520, height: 300 }, { x: 0, duration: 0.45, ease: 'power3.out' }, 0);
            tl.to('#s7c', { y: 0, width: 600, height: 640, duration: 0.7, ease: 'power3.inOut' }, 0.35);
            const eb = document.querySelector('#s7c-eb span');
            tl.set(eb, { textContent: 'Final result' }, 0);
            tl.to('#s7c-eb', { opacity: 0, duration: 0.12 }, 0.45);
            tl.set(eb, { textContent: 'Human review' }, 0.57);
            tl.to('#s7c-eb', { opacity: 1, duration: 0.2 }, 0.58);
            const pill = document.getElementById('s7c-pilltxt');
            tl.set(pill, { textContent: 'READY FOR REVIEW' }, 0);
            tl.set('#s7c-pill', { backgroundColor: 'rgba(240,131,42,0.14)', color: '#C2621A' }, 0);
            tl.set(pill, { textContent: 'REVIEWING…' }, 1.0);
            tl.fromTo('#s7c-kpis', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out' }, 0.75);
            tl.fromTo('#s7c-lab', { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.95);
            tl.fromTo(['#s7c-row0', '#s7c-row1', '#s7c-row2'], { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.35, ease: 'power3.out', stagger: 0.1 }, 1.0);
            tl.set(['#s7c-ck0', '#s7c-ck1', '#s7c-ck2'], { scale: 0.5, backgroundColor: 'rgba(29,33,37,0.12)' }, 0);
            tl.fromTo(['#s7c-btn', '#s7c-btn2', '#s7c-foot'], { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power3.out', stagger: 0.08 }, 1.3);
            tl.set('#s7c-btnfill', { scaleX: 1 }, 0);
            tl.set('#s7c-btntxt', { opacity: 0 }, 0);
            tl.set('#s7c-stamp', { opacity: 0 }, 0);

            // HUMAN REVIEW — people remain the decision-makers
            tl.fromTo('.s7-tw', { yPercent: 105 }, { yPercent: 0, duration: 0.65, ease: 'expo.out', stagger: 0.1 }, 0.45);

            // the manager reviews: checks tick in sequence
            [2.65, 3.05, 3.45].forEach(function (t, k) {
              tl.to('#s7c-ck' + k, { scale: 1, backgroundColor: '#1E9E58', duration: 0.3, ease: 'back.out(2.2)' }, t);
            });
            // approve: the manager's cursor presses the button
            tl.fromTo('#s7-cur', { x: 1180, y: 760, opacity: 0 }, { opacity: 1, duration: 0.25 }, 3.45);
            tl.to('#s7-cur', { x: 300, y: 690, duration: 0.75, ease: 'power3.inOut' }, 3.5);
            tl.to('#s7-cur', { scale: 0.85, duration: 0.06 }, 4.28); tl.to('#s7-cur', { scale: 1, duration: 0.12 }, 4.35);
            tl.set('#s7-rip', { opacity: 0 }, 0);
            tl.fromTo('#s7-rip', { x: 300, y: 690, scale: 0.3, opacity: 0.9 }, { scale: 2.2, opacity: 0, duration: 0.6, ease: 'power2.out', immediateRender: false }, 4.3);
            tl.to('#s7c-btnfill', { scaleX: 0, duration: 0.35, ease: 'power3.inOut' }, 4.3);
            tl.to('#s7-approve', { opacity: 0, duration: 0.12 }, 4.3);
            tl.to('#s7c-btntxt', { opacity: 1, duration: 0.2 }, 4.42);
            tl.set(pill, { textContent: 'APPROVED' }, 4.4);
            tl.to('#s7c-pill', { backgroundColor: 'rgba(30,158,88,0.14)', color: '#1E9E58', duration: 0.2 }, 4.4);
            tl.fromTo('#s7c-stamp', { opacity: 0, scale: 2.2, rotation: -9 }, { opacity: 1, scale: 1, rotation: -9, duration: 0.32, ease: 'power4.in', immediateRender: false }, 4.42);
            tl.fromTo('#s7-glow', { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1.05, duration: 0.3, ease: 'power2.out' }, 4.72);
            tl.to('#s7-glow', { opacity: 0, duration: 0.9, ease: 'power2.in' }, 5.05);
            tl.to('#s7-cur', { x: 520, y: 900, opacity: 0, duration: 0.6, ease: 'power2.in' }, 5.2);
            // clear the headline before the pull-back into scene 8
            tl.to('.s7-tw', { yPercent: -105, duration: 0.45, ease: 'power3.in', stagger: 0.06 }, 5.85);

            AF.allow('#s7-cur, #s7-cur *, #s7-approve, #s7c-btntxt, #s7c *');
            window.__timelines['s7-review'] = tl;
          }
          if (document.fonts && document.fonts.ready) document.fonts.ready.then(build); else build();
        })();
      </script>
    </template>
  </body>
</html>
