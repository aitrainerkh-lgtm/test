            <div class="toast glass s1-toast" id="s1-n1"><div class="ti" style="background:rgba(240,131,42,.16)">__CAL__</div><div><b>Meeting in 10 min</b><span>Weekly sales review</span></div></div>

            <div class="toast glass s1-toast" id="s1-n4"><div class="ti" style="background:rgba(30,158,88,.14)">__DOC__</div><div><b>Document shared</b><span>Budget_2026.xlsx</span></div></div>

        <div id="s1-flash"></div>

      <script>
        (function () {
          const root = document.getElementById('s1');
          // icons
          const rep = { __CLOCK__: AF.icon('clock', 20, '#F0832A', 2.2), __MAIL__: AF.icon('mail', 20, '#1E9E58'), __CAL__: AF.icon('calendar', 20, '#F0832A'),
            __CHAT__: AF.icon('chat', 20, '#1D2125'), __BELL__: AF.icon('bell', 20, '#F0832A'), __DOC__: AF.icon('doc', 20, '#1E9E58') };
          root.querySelectorAll('.dot, .ti').forEach(function (el) { const k = el.textContent.trim(); if (rep[k]) el.innerHTML = rep[k]; });
          // spreadsheet grid
          const grid = document.getElementById('s1-grid');
          const vals = ['$12,480', '$9,820', '$7,310', '$8,640', '$4,700', '$15,230', '$6,950', '$11,200', '$3,980', '$9,140', '$5,560', '$13,720', '$8,090', '$10,450', '$7,770'];
          let html = '';
          for (let r = 0; r < 6; r++) for (let c = 0; c < 4; c++) {
            const head = r === 0;
            const txt = head ? ['Branch', 'Mon', 'Tue', 'Wed'][c] : (c === 0 ? ['PP', 'SR', 'BB', 'SHV', 'KP'][r - 1] : vals[((r - 1) * 3 + c - 1) % vals.length]);
            html += '<div class="cell s1-cell' + (head ? ' hd' : '') + '" style="left:' + (c === 0 ? 0 : 70 + (c - 1) * 120) + 'px;top:' + (r * 40 + 6) + 'px;width:' + (c === 0 ? 70 : 120) + 'px;' +
              (head ? 'font-family:Inter;font-weight:700;color:#59616A;background:rgba(29,33,37,.03);' : '') + (c === 0 && !head ? 'font-family:Inter;font-weight:600;justify-content:flex-start;padding-left:12px;' : '') + '">' + txt + '</div>';
          }
          grid.innerHTML = html;

          const tl = gsap.timeline({ paused: true });

          // camera: slow push toward the laptop, then a zoom-through into it
          tl.fromTo('#s1-cam', { scale: 1, filter: 'blur(0px)' }, { scale: 1.1, duration: 3.55, ease: 'sine.inOut' }, 0);
          tl.to('#s1-cam', { scale: 3.6, duration: 0.9, ease: 'power3.in' }, 3.55);
          tl.to('#s1-cam', { filter: 'blur(16px)', duration: 0.6, ease: 'power2.in' }, 3.85);
          tl.fromTo('#s1-flash', { opacity: 0 }, { opacity: 1, duration: 0.42, ease: 'power2.in' }, 4.03);

          // cards: staggered depth entrances
          const cards = [['#s1-c6', 0.05, 0.4], ['#s1-c1', 0.22, 0.7], ['#s1-b1', 0.42, 0.8], ['#s1-c2', 0.62, 0.85], ['#s1-c5', 0.85, 0.35],
            ['#s1-c4', 1.05, 0.4], ['#s1-c3', 1.25, 1.0], ['#s1-b2', 1.5, 0.8], ['#s1-clock', 0.12, 0.9]];
          cards.forEach(function (c) {
            tl.fromTo(c[0], { opacity: 0, scale: 0.72, y: 36, rotationX: 14 }, { opacity: 1, scale: 1, y: 0, rotationX: 0, duration: 0.55, ease: 'power3.out' }, c[1]);
            // slow parallax drift while held (depth-scaled), then fly past camera on the zoom-through
            const el = root.querySelector(c[0]);
            const bx = AF.box(el); const bw = bx.w || 320, bh = bx.h || 60;
            const cx = bx.l + bw / 2 - 1330, cy = bx.t + bh / 2 - 900;
            const len = Math.max(1, Math.hypot(cx, cy));
            tl.to(c[0], { x: (cx / len) * 26 * c[2], y: (cy / len) * 18 * c[2], duration: 3.55 - c[1] - 0.55, ease: 'none' }, c[1] + 0.55);
            tl.to(c[0], { x: (cx / len) * 900 * c[2], y: (cy / len) * 700 * c[2], scale: 1 + 1.4 * c[2], opacity: 0, duration: 0.75, ease: 'power3.in' }, 3.58 + (1 - c[2]) * 0.08);
          });

          // inbox: new mails slide in, counter climbs
          tl.fromTo('.s1-mail', { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power3.out', stagger: 0.32 }, 0.5);
          AF.count(tl, document.getElementById('s1-count'), 12, 47, 0.35, 3.1, null, 'power1.in');
          // browser tabs pile up + loader sweeps
          tl.fromTo('.s1-tab', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.25, ease: 'power2.out', stagger: 0.18 }, 0.85);
          tl.fromTo('#s1-load', { scaleX: 0 }, { scaleX: 1, duration: 1.0, ease: 'power1.inOut' }, 1.0);
          tl.to('#s1-load', { opacity: 0, duration: 0.2 }, 2.05);
          tl.set('#s1-load', { scaleX: 0 }, 2.25);
          tl.to('#s1-load', { opacity: 1, duration: 0.1 }, 2.25);
          tl.to('#s1-load', { scaleX: 0.85, duration: 1.2, ease: 'power1.inOut' }, 2.26);
          // spreadsheet cells fill
          tl.fromTo('#s1 .s1-cell:not(.hd)', { opacity: 0 }, { opacity: 1, duration: 0.12, stagger: 0.06 }, 1.45);
          // calendar events pop
          tl.fromTo('.s1-ev', { scaleX: 0, transformOrigin: 'left center' }, { scaleX: 1, duration: 0.3, ease: 'power3.out', stagger: 0.16 }, 1.2);
          // mini chart bars
          tl.fromTo('#s1-bars i', { scaleY: 0, transformOrigin: 'bottom center' }, { scaleY: 1, duration: 0.5, ease: 'power3.out', stagger: 0.08 }, 0.2);
          // clock races through the working day
          const tEl = document.getElementById('s1-time'); const clk = { m: 540 };
          tl.fromTo(clk, { m: 540 }, { m: 1065, duration: 3.4, ease: 'power1.in', onUpdate: function () {
            const m = Math.round(clk.m); tEl.textContent = String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
          } }, 0.15);
          // notifications stack in from the right, pushing older ones down
          const nt = [0.55, 1.05, 1.5, 1.95, 2.4];
          nt.forEach(function (t, i) {
            tl.fromTo('#s1-n' + i, { x: 120, opacity: 0, y: 0 }, { x: 0, opacity: 1, duration: 0.42, ease: 'power3.out' }, t);
            for (let j = 0; j < i; j++) tl.to('#s1-n' + j, { y: '+=76', duration: 0.35, ease: 'power3.out' }, t);
          });
          tl.to('.s1-toast', { x: 700, opacity: 0, duration: 0.6, ease: 'power3.in', stagger: 0.03 }, 3.55);
          // pressure tags slam in late
          [['#s1-t1', 2.55], ['#s1-t2', 2.75], ['#s1-t3', 2.95]].forEach(function (t) {
            tl.fromTo(t[0], { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: 'power3.out' }, t[1]);
            tl.to(t[0], { opacity: 0, scale: 2.2, duration: 0.5, ease: 'power3.in' }, 3.6);
          });

          window.__timelines['s1-hook'] = tl;
        })();
      </script>
