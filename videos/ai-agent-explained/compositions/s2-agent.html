<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #s2 { position: absolute; inset: 0; overflow: hidden; }
        #s2-cam { position: absolute; inset: 0; transform-origin: 960px 450px; }
        #s2-bar { left: 380px; top: 412px; width: 1160px; height: 116px; border-radius: 999px; }
        #s2-bar-glow { position: absolute; left: -6px; top: -6px; right: -6px; bottom: -6px; border-radius: 999px; border: 3px solid #33C27A; opacity: 0; box-shadow: 0 0 30px rgba(51,194,122,.55); }
        #s2-spark { position: absolute; left: 26px; top: 26px; width: 64px; height: 64px; border-radius: 50%; background: rgba(30,158,88,.12); display: flex; align-items: center; justify-content: center; }
        #s2-ph, #s2-text, #s2-chars { position: absolute; left: 116px; top: 0; height: 116px; line-height: 116px; font: 600 40px 'Inter', sans-serif; letter-spacing: -.01em; white-space: nowrap; }
        #s2-ph { color: #9AA1A7; }
        #s2-text { color: #1D2125; }
        #s2-chars { color: #1D2125; opacity: 0; }
        #s2-caret { position: absolute; top: 34px; width: 3px; height: 48px; border-radius: 2px; background: #1E9E58; }
        #s2-send { position: absolute; right: 23px; top: 23px; width: 70px; height: 70px; border-radius: 50%; background: #1D2125; display: flex; align-items: center; justify-content: center; }
        #s2-label { left: 410px; top: 352px; }
        #s2-agent-wrap { position: absolute; left: 840px; top: 280px; width: 240px; height: 240px; }
        #s2-title { position: absolute; left: 0; width: 1920px; top: 610px; text-align: center; font-size: 132px; }
        #s2-title .ai { color: #1E9E58; }
        #s2-uline { position: absolute; left: 760px; top: 760px; width: 400px; height: 6px; border-radius: 3px; background: linear-gradient(90deg, #1E9E58, #F0832A); transform-origin: left center; }
        #s2-status { left: 0; top: 806px; }
        #s2-status .dot { background: rgba(30,158,88,.14); }
        #s2-status-txt { font: 600 21px 'Inter', sans-serif; color: #1D2125; }
        #s2 .tool { position: absolute; left: 0; top: 0; width: 60px; height: 60px; border-radius: 18px; display: flex; align-items: center; justify-content: center; }
        #s2 .pt { position: absolute; left: 0; top: 0; width: 9px; height: 9px; border-radius: 50%; }
        #s2-burst { position: absolute; left: 860px; top: 300px; width: 200px; height: 200px; border-radius: 50%; border: 3px solid rgba(51,194,122,.8); }
        #s2-flash { position: absolute; inset: 0; background: #F7F9F8; }
        #s2-clipshine { position: absolute; inset: 0; border-radius: 999px; overflow: hidden; }
        #s2-shine { position: absolute; top: 0; left: 0; width: 260px; height: 116px; background: linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(51,194,122,.16) 45%, rgba(255,255,255,.7) 50%, rgba(240,131,42,.12) 56%, rgba(255,255,255,0) 100%); }
      </style>

      <div id="s2" data-composition-id="s2-agent" data-width="1920" data-height="1080" data-duration="7.1" class="af">
        <div id="s2-cam">
          <div class="chip" id="s2-label"><div class="dot" style="background:rgba(30,158,88,.14)">__SPARK__</div>New task</div>
          <div class="glass" id="s2-bar">
            <div id="s2-clipshine"><div id="s2-shine"></div></div>
            <div id="s2-bar-glow"></div>
            <div id="s2-spark">__SPARK2__</div>
            <div id="s2-ph">Ask AI Agent to do anything…</div>
            <div id="s2-text"></div>
            <div id="s2-chars" data-layout-allow-overlap></div>
            <div id="s2-caret"></div>
            <div id="s2-send">__SEND__</div>
          </div>
          <div id="s2-particles"></div>
          <div id="s2-burst"></div>
          <div id="s2-tools"></div>
          <div id="s2-agent-wrap"></div>
          <div id="s2-title" class="kt"></div>
          <div id="s2-uline"></div>
          <div class="chip" id="s2-status"><div class="dot">__BOLT__</div><span id="s2-status-txt"></span></div>
        </div>
        <div id="s2-flash"></div>
      </div>

      <script>
        (function () {
          const PROMPT = "Prepare today's business report.";
          const STATUS = "Working on: today's business report";
          const root = document.getElementById('s2');
          root.querySelector('#s2-label .dot').innerHTML = AF.icon('sparkle', 16, '#1E9E58');
          document.getElementById('s2-spark').innerHTML = AF.icon('sparkle', 32, '#1E9E58', 2);
          document.getElementById('s2-send').innerHTML = AF.icon('send', 32, '#fff', 2.6);
          root.querySelector('#s2-status .dot').innerHTML = AF.icon('bolt', 16, '#1E9E58', 2.2);
          document.getElementById('s2-agent-wrap').innerHTML = AF.agent('s2-ag', 240);
          document.getElementById('s2-chars').innerHTML = AF.chars(PROMPT, 'ch s2-ch');
          document.getElementById('s2-title').innerHTML = '<span class="wmask"><span class="w s2-tw ai">AI</span></span><span class="wsp"> </span><span class="wmask"><span class="w s2-tw">AGENT</span></span>';
          const tools = ['globe', 'doc', 'sheet', 'calendar', 'mail', 'chart'];
          const tcol = ['#1E9E58', '#F0832A', '#1E9E58', '#F0832A', '#1E9E58', '#F0832A'];
          document.getElementById('s2-tools').innerHTML = tools.map(function (t, i) {
            return '<div class="tool glass s2-tool" id="s2-tool' + i + '">' + AF.icon(t, 28, tcol[i], 2.1) + '</div>';
          }).join('');
          // particles (deterministic)
          const R = AF.rng(7); let ph = '';
          const P = [];
          for (let i = 0; i < 90; i++) {
            const sx = 500 + R() * 960, sy = 440 + R() * 70;
            const col = R() < 0.62 ? '#1E9E58' : (R() < 0.6 ? '#F0832A' : '#1D2125');
            const sz = 4 + R() * 8;
            P.push({ sx: sx, sy: sy, mx: 960 + (R() - 0.5) * 900, my: 120 + R() * 260, d: R() });
            ph += '<div class="pt s2-pt" id="s2-pt' + i + '" style="background:' + col + ';width:' + sz + 'px;height:' + sz + 'px;"></div>';
          }
          document.getElementById('s2-particles').innerHTML = ph;

          function build() {
            const tl = gsap.timeline({ paused: true });
            // arrival: continue the zoom-through from the laptop
            tl.fromTo('#s2-flash', { opacity: 1 }, { opacity: 0, duration: 0.5, ease: 'power2.out' }, 0);
            tl.fromTo('#s2-cam', { scale: 0.78, filter: 'blur(14px)' }, { scale: 1, filter: 'blur(0px)', duration: 0.75, ease: 'expo.out' }, 0);
            tl.to('#s2-cam', { scale: 1.05, duration: 5.6, ease: 'sine.inOut' }, 0.8);
            tl.fromTo('#s2-label', { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: 'power3.out' }, 0.35);
            tl.fromTo('#s2-bar', { y: 40 }, { y: 0, duration: 0.8, ease: 'expo.out' }, 0);

            // caret blink (finite, deterministic) then typing synced to the Khmer phrase
            const caret = document.getElementById('s2-caret');
            const textEl = document.getElementById('s2-text');
            tl.set(caret, { x: 0 }, 0);
            [0.5, 1.0, 1.5].forEach(function (t) { tl.to(caret, { opacity: 0, duration: 0.05 }, t); tl.to(caret, { opacity: 1, duration: 0.05 }, t + 0.25); });
            tl.fromTo('#s2-shine', { x: -300 }, { x: 1200, duration: 1.3, ease: 'power2.inOut' }, 0.55);
            tl.fromTo('#s2-spark .ic', { rotation: 0 }, { rotation: 180, duration: 1.6, ease: 'power2.inOut' }, 0.3);
            tl.to('#s2-ph', { opacity: 0, duration: 0.15 }, 1.9);
            const spans = root.querySelectorAll('.s2-ch');
            const FONT = '600 40px Inter'; const LS = -0.4;
            const widths = PROMPT.split('').map(function (c, i) { return AF.measure(PROMPT.slice(0, i + 1), FONT, LS); });
            const o = { v: 0 };
            tl.fromTo(o, { v: 0 }, { v: PROMPT.length, duration: 1.9, ease: 'none', onUpdate: function () {
              const n = Math.round(o.v); textEl.textContent = PROMPT.slice(0, n);
              caret.style.transform = 'translateX(' + (n ? widths[n - 1] + 4 : 0) + 'px)';
              caret.style.left = '116px';
            } }, 1.95);
            caret.style.left = '116px';
            // send
            tl.to('#s2-send', { scale: 0.86, duration: 0.08, ease: 'power2.in' }, 3.95);
            tl.to('#s2-send', { scale: 1, backgroundColor: '#1E9E58', duration: 0.25, ease: 'power3.out' }, 4.03);
            tl.fromTo('#s2-bar-glow', { opacity: 0, scale: 0.98 }, { opacity: 1, scale: 1, duration: 0.2 }, 3.98);
            tl.to(caret, { opacity: 0, duration: 0.05 }, 3.98);

            // disintegrate: letters fly into the forming agent
            tl.set('#s2-text', { opacity: 0 }, 4.06);
            tl.set('#s2-chars', { opacity: 1 }, 4.06);
            const barRect = { x: 380 + 116, y: 412 + 58 };
            spans.forEach(function (s, i) {
              const cx = barRect.x + (i ? widths[i - 1] : 0) + (widths[i] - (i ? widths[i - 1] : 0)) / 2, cy = barRect.y;
              const dx = 960 - cx, dy = 400 - cy;
              const delay = 4.08 + Math.abs(i - spans.length / 2) * 0.012;
              tl.to(s, { x: dx, duration: 0.62, ease: 'power2.in' }, delay);
              tl.to(s, { y: dy - 80 * Math.sin((i / spans.length) * Math.PI), duration: 0.34, ease: 'power2.out' }, delay);
              tl.to(s, { y: dy, duration: 0.28, ease: 'power2.in' }, delay + 0.34);
              tl.to(s, { scale: 0.2, opacity: 0, color: '#1E9E58', duration: 0.62, ease: 'power2.in' }, delay);
            });
            P.forEach(function (p, i) {
              const st = 4.05 + p.d * 0.3;
              tl.fromTo('#s2-pt' + i, { x: p.sx, y: p.sy, opacity: 0, scale: 1 }, { opacity: 1, duration: 0.08 }, st);
              tl.to('#s2-pt' + i, { x: p.mx, duration: 0.35, ease: 'power2.out' }, st);
              tl.to('#s2-pt' + i, { y: p.my, duration: 0.35, ease: 'sine.out' }, st);
              tl.to('#s2-pt' + i, { x: 955, duration: 0.42, ease: 'power3.in' }, st + 0.35);
              tl.to('#s2-pt' + i, { y: 395, scale: 0.3, duration: 0.42, ease: 'power3.in' }, st + 0.35);
              tl.to('#s2-pt' + i, { opacity: 0, duration: 0.06 }, st + 0.74);
            });
            tl.to('#s2-bar', { y: 70, opacity: 0, scale: 0.94, duration: 0.6, ease: 'power3.in' }, 4.2);
            tl.to('#s2-label', { y: 40, opacity: 0, duration: 0.4, ease: 'power3.in' }, 4.15);

            // the agent forms
            tl.fromTo('#s2-ag-orb', { scale: 0 }, { scale: 1, duration: 0.7, ease: 'expo.out' }, 4.72);
            tl.fromTo('#s2-ag-halo', { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 0.75, duration: 0.9, ease: 'expo.out' }, 4.72);
            tl.fromTo('#s2-ag .agent-orbit', { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.8, ease: 'expo.out', stagger: 0.04 }, 4.82);
            tl.fromTo('#s2-ag-eyes i', { scaleY: 0.08 }, { scaleY: 1, duration: 0.22, ease: 'power2.out' }, 5.3);
            AF.agentLife(tl, 's2-ag', 4.8, 2.3, 1.3);
            AF.blink(tl, 's2-ag', 6.35);
            tl.set('#s2-burst', { opacity: 0 }, 0);
            tl.fromTo('#s2-burst', { scale: 0.4, opacity: 0.9 }, { scale: 3.2, opacity: 0, duration: 0.9, ease: 'expo.out', immediateRender: false }, 4.76);

            // AI AGENT title
            tl.fromTo('.s2-tw', { yPercent: 105 }, { yPercent: 0, duration: 0.7, ease: 'expo.out', stagger: 0.09 }, 4.9);
            tl.fromTo('#s2-uline', { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: 'power3.inOut' }, 5.15);
            // status chip types on
            const stEl = document.getElementById('s2-status-txt');
            const stW = 21 * 0.56 * STATUS.length + 90;
            document.getElementById('s2-status').style.left = (960 - stW / 2) + 'px';
            tl.fromTo('#s2-status', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 5.35);
            AF.type(tl, stEl, STATUS, 5.5, 0.75);

            // tools begin to orbit the agent
            const orbit = { a: 0 };
            const toolEls = root.querySelectorAll('.s2-tool');
            function placeTools() {
              toolEls.forEach(function (el, i) {
                const ang = orbit.a + i * (Math.PI * 2 / toolEls.length);
                const x = 960 + Math.cos(ang) * 330 - 30, y = 400 + Math.sin(ang) * 120 - 30;
                const depth = (Math.sin(ang) + 1) / 2;
                el.style.left = x + 'px'; el.style.top = y + 'px';
                el.style.zIndex = depth > 0.5 ? 5 : 1;
              });
            }
            tl.fromTo(orbit, { a: -0.6 }, { a: 1.6, duration: 2.0, ease: 'none', onUpdate: placeTools }, 5.1);
            tl.fromTo('.s2-tool', { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.45, ease: 'expo.out', stagger: 0.07 }, 5.55);
            placeTools();

            // hand-off to scene 3: agent shrinks to its pipeline post, everything else carries left
            tl.to('#s2-agent-wrap', { x: 360 - 960, y: 300 - 400, scale: 110 / 240, duration: 0.6, ease: 'power3.inOut' }, 6.5);
            tl.to(['#s2-title', '#s2-uline'], { x: -260, opacity: 0, duration: 0.34, ease: 'power4.in' }, 6.55);
            tl.to('#s2-status', { x: -260, opacity: 0, duration: 0.34, ease: 'power4.in' }, 6.6);
            tl.to('.s2-tool', { opacity: 0, scale: 0.3, duration: 0.3, ease: 'power3.in', stagger: 0.02 }, 6.5);
            tl.to('#s2-cam', { scale: 1, duration: 0.6, ease: 'power3.inOut' }, 6.5);

            AF.allow('#s2 .s2-ch');
            window.__timelines['s2-agent'] = tl;
          }
          if (document.fonts && document.fonts.ready) document.fonts.ready.then(build); else build();
        })();
      </script>
    </template>
  </body>
</html>
