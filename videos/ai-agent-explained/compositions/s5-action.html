<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: 'Space Grotesk'; src: url('assets/fonts/SpaceGrotesk.ttf') format('truetype'); font-weight: 300 700; }
        #s5 { position: absolute; inset: 0; overflow: hidden; }
        #s5-cam { position: absolute; inset: 0; transform-origin: 960px 540px; }
        #s5-persp { position: absolute; inset: 0; perspective: 2000px; }
        #s5-title { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: flex; align-items: center; justify-content: center; font-size: 176px; transform-origin: 110px 70px; }
        #s5-title .ac { color: #F0832A; }
        #s5 .chip5 { position: absolute; left: 0; top: 0; width: 250px; height: 52px; border-radius: 999px; display: flex; align-items: center; gap: 10px; padding: 0 16px 0 10px; font: 600 20px 'Inter', sans-serif; color: #1D2125; white-space: nowrap;
          background: #fff; box-shadow: 0 0 0 1px rgba(29,33,37,.07), 0 14px 28px -12px rgba(20,36,28,.32); }
        #s5 .chip5 .d { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; }
        #s5-sheet { left: 470px; top: 300px; width: 980px; height: 560px; }
        #s5 .cell { position: absolute; height: 60px; display: flex; align-items: center; justify-content: flex-end; padding-right: 18px; font: 500 22px 'JetBrains Mono', monospace; color: #1D2125; border-bottom: 1px solid rgba(29,33,37,.06); }
        #s5-chart { left: 470px; top: 300px; width: 980px; height: 560px; border-radius: 22px; transform-origin: 0 0; }
        #s5 .bar { position: absolute; width: 96px; border-radius: 10px 10px 4px 4px; transform-origin: 0 0; }
        #s5 .blab { position: absolute; width: 168px; text-align: center; font: 600 17px 'Inter', sans-serif; color: #59616A; }
        #s5 .bval { position: absolute; width: 168px; text-align: center; font: 700 19px 'JetBrains Mono', monospace; color: #1D2125; }
        #s5-report { left: 610px; top: 70px; width: 700px; height: 940px; border-radius: 20px; background: #fff; transform-origin: 50% 50%;
          box-shadow: 0 0 0 1px rgba(29,33,37,.06), 0 40px 80px -30px rgba(20,36,28,.40), 0 10px 22px -10px rgba(20,36,28,.16); }
        #s5 .pg { position: absolute; left: 610px; top: 70px; width: 700px; height: 940px; border-radius: 20px; background: #FBFCFB; box-shadow: 0 0 0 1px rgba(29,33,37,.06), 0 30px 60px -30px rgba(20,36,28,.35); }
        #s5-rhead { position: absolute; left: 0; top: 0; right: 0; height: 128px; border-radius: 20px 20px 0 0; background: linear-gradient(120deg, #1D2125, #2A3237); padding: 30px 34px; color: #fff; }
        #s5-rhead b { display: block; font: 700 34px 'Space Grotesk', sans-serif; letter-spacing: -.01em; }
        #s5-rhead span { display: block; margin-top: 8px; font: 500 16px 'Inter', sans-serif; color: rgba(255,255,255,.7); }
        #s5 .kpi { position: absolute; top: 152px; width: 200px; height: 112px; border-radius: 14px; background: #F4F7F5; padding: 16px 18px; }
        #s5 .kpi i { display: block; font: 600 14px 'Inter', sans-serif; font-style: normal; color: #59616A; letter-spacing: .04em; text-transform: uppercase; }
        #s5 .kpi b { display: block; margin-top: 10px; font: 700 32px 'Space Grotesk', sans-serif; color: #1D2125; }
        #s5-slot { position: absolute; left: 30px; top: 285px; width: 640px; height: 366px; border-radius: 14px; border: 2px dashed rgba(29,33,37,.1); }
        #s5 .rl { position: absolute; left: 34px; height: 12px; border-radius: 6px; background: rgba(29,33,37,.09); transform-origin: left center; }
        #s5-sumh { position: absolute; left: 34px; top: 676px; font: 700 18px 'Inter', sans-serif; color: #1D2125; }
        #s5-sum1 { position: absolute; left: 34px; top: 708px; font: 500 18px 'Inter', sans-serif; color: #1D2125; white-space: nowrap; }
        #s5 .bul { position: absolute; left: 34px; display: flex; align-items: center; gap: 12px; }
        #s5 .bul .c { width: 26px; height: 26px; border-radius: 50%; background: #1E9E58; display: flex; align-items: center; justify-content: center; }
        #s5-stamp { position: absolute; left: 440px; top: 32px; height: 64px; padding: 0 22px; border-radius: 16px; border: 3px solid #1E9E58; color: #1E9E58; background: rgba(255,255,255,.92); display: flex; align-items: center; gap: 10px; font: 700 24px 'Space Grotesk', sans-serif; letter-spacing: .08em; transform: rotate(-8deg); }
        #s5-file { position: absolute; left: 620px; top: 920px; }
        #s5-t1 { position: absolute; left: 110px; top: 360px; font-size: 92px; color: #9AA1A7; }
        #s5-strike { position: absolute; left: 106px; top: 410px; width: 780px; height: 7px; border-radius: 4px; background: #F0832A; transform-origin: left center; }
        #s5-t2 { position: absolute; left: 106px; top: 480px; font-size: 136px; color: #1E9E58; }
        #s5 .flash { position: absolute; left: 470px; top: 300px; width: 980px; height: 560px; border-radius: 22px; border: 4px solid #33C27A; box-shadow: 0 0 40px rgba(51,194,122,.5); opacity: 0; }
      </style>

      <div id="s5" data-composition-id="s5-action" data-width="1920" data-height="1080" data-duration="9.78" class="af">
        <div id="s5-cam"><div id="s5-persp">
          <div class="pg" id="s5-pg3"></div>
          <div class="pg" id="s5-pg2"></div>
          <div class="abs" id="s5-report">
            <div id="s5-rhead"><b>Daily Business Report</b><span>Prepared by AI Agent · Today</span></div>
            <div class="kpi" id="s5-k0" style="left:30px;"><i>Revenue</i><b id="s5-kv0">$0</b></div>
            <div class="kpi" id="s5-k1" style="left:250px;"><i>Orders</i><b id="s5-kv1">0</b></div>
            <div class="kpi" id="s5-k2" style="left:470px;"><i>Growth</i><b id="s5-kv2" style="color:#1E9E58">+0%</b></div>
            <div id="s5-slot"></div>
            <div id="s5-sumh">Summary</div>
            <div id="s5-sum1">Phnom Penh leads sales at $18,450 (+12%).</div>
            <div class="rl s5-rl" style="top:748px;width:600px"></div>
            <div class="rl s5-rl" style="top:772px;width:520px"></div>
            <div class="bul s5-bul" style="top:810px;"><div class="c">__CK__</div><div class="rl" style="position:static;width:420px"></div></div>
            <div class="bul s5-bul" style="top:852px;"><div class="c">__CK__</div><div class="rl" style="position:static;width:360px"></div></div>
            <div id="s5-stamp">__CKG__ COMPLETED</div>
          </div>
          <div class="glass" id="s5-sheet" data-layout-allow-overlap>
            <div class="win-bar"><div class="win-dots"><i></i><i></i><i></i></div>Daily_Sales.xlsx</div>
            <div id="s5-grid"></div>
          </div>
          <div class="flash" id="s5-flash"></div>
          <div class="glass" id="s5-chart" data-layout-allow-overlap>
            <div class="eyebrow" style="position:absolute;left:30px;top:24px;">Sales by branch</div>
            <div style="position:absolute;left:30px;top:56px;font:700 30px 'Space Grotesk',sans-serif;color:#1D2125;" id="s5-ctot">$48,920</div>
            <div id="s5-axis" style="position:absolute;left:60px;right:60px;top:500px;height:2px;background:rgba(29,33,37,.14);transform-origin:left center;"></div>
            <svg id="s5-line" width="980" height="560" style="position:absolute;left:0;top:0;overflow:visible"></svg>
          </div>
          <div id="s5-bars" data-layout-allow-overlap></div>
          <div id="s5-title" class="kt" data-layout-allow-overlap><span class="wmask"><span class="w s5-tw">TAKE</span></span><span class="wsp">&nbsp;</span><span class="wmask"><span class="w s5-tw ac">ACTION</span></span></div>
          <div id="s5-t1" class="kt" data-layout-allow-overlap><span class="wmask"><span class="w s5-t1w">NOT JUST TALK.</span></span></div>
          <div id="s5-strike"></div>
          <div id="s5-t2" class="kt" data-layout-allow-overlap><span class="wmask"><span class="w s5-t2w">REAL WORK.</span></span></div>
          <div class="chip" id="s5-file"><div class="dot" style="background:rgba(240,131,42,.15)">__PDF__</div>Business_Report.pdf</div>
          <div id="s5-chips"></div>
        </div></div>
      </div>

      <script>
        (function () {
          const root = document.getElementById('s5');
          root.querySelectorAll('.bul .c').forEach(function (el) { el.innerHTML = AF.icon('check', 15, '#fff', 3); });
          document.getElementById('s5-stamp').innerHTML = AF.icon('check', 26, '#1E9E58', 3) + 'COMPLETED';
          root.querySelector('#s5-file .dot').innerHTML = AF.icon('file', 16, '#F0832A', 2.2);
          const C = [['globe', 'Market update', '#1E9E58'], ['doc', 'Sales targets', '#F0832A'], ['sheet', 'Sales data', '#1E9E58'], ['calendar', 'Review at 4 PM', '#F0832A']];
          const CP = [[330, 300], [1590, 300], [330, 780], [1590, 780]];
          document.getElementById('s5-chips').innerHTML = C.map(function (c, i) {
            return '<div class="chip5" id="s5-c' + i + '"><div class="d" style="background:' + c[2] + '20">' + AF.icon(c[0], 18, c[2], 2.2) + '</div>' + c[1] + '</div>';
          }).join('');
          // spreadsheet cells (screen coordinates, inside a 980x560 window at 470,300)
          const rows = [['Branch', 'Sales', 'Orders', 'Growth'], ['Phnom Penh', '$18,450', '142', '+12%'], ['Siem Reap', '$9,820', '76', '+8%'], ['Battambang', '$7,310', '58', '+5%'], ['Sihanoukville', '$8,640', '61', '+9%'], ['Kampot', '$4,700', '39', '+4%'], ['Total', '$48,920', '376', '+9%']];
          const cx = [20, 320, 560, 760], cw = [300, 240, 200, 200];
          let gh = '';
          rows.forEach(function (r, ri) {
            r.forEach(function (v, ci) {
              const hd = ri === 0, tot = ri === 6;
              gh += '<div class="cell ' + (hd ? 's5-hd' : 's5-cell s5-r' + ri) + (ci === 1 && !hd && !tot ? ' s5-sales' : '') + '" id="s5-cell' + ri + '-' + ci + '" style="left:' + cx[ci] + 'px;top:' + (58 + ri * 66) + 'px;width:' + cw[ci] + 'px;' +
                (ci === 0 ? 'justify-content:flex-start;padding-left:18px;font-family:Inter;font-weight:600;' : '') +
                (hd ? 'font-family:Inter;font-weight:700;color:#59616A;font-size:18px;letter-spacing:.04em;' : '') +
                (tot ? 'font-weight:700;background:rgba(30,158,88,.08);border-radius:10px;' : '') + (ci === 3 && !hd ? 'color:#1E9E58;' : '') + '">' + v + '</div>';
            });
          });
          document.getElementById('s5-grid').innerHTML = gh;
          // bars: final chart geometry (screen coordinates)
          const vals = [18450, 9820, 7310, 8640, 4700], names = ['Phnom Penh', 'Siem Reap', 'Battambang', 'Sihanoukville', 'Kampot'];
          const growth = [12, 8, 5, 9, 4];
          let bh = '';
          const B = vals.map(function (v, i) {
            const ccx = 470 + 60 + (i + 0.5) * 172, h = Math.round(v / 18450 * 300);
            return { cx: ccx, h: h, left: ccx - 48, top: 800 - h };
          });
          B.forEach(function (b, i) {
            bh += '<div class="bar s5-bar" data-l="' + b.left + '" data-t="' + b.top + '" id="s5-b' + i + '" style="left:' + b.left + 'px;top:' + b.top + 'px;height:' + b.h + 'px;background:' + (i === 0 ? 'linear-gradient(180deg,#33C27A,#1E9E58)' : 'linear-gradient(180deg,#9FDFBE,#5FC892)') + ';"></div>';
            bh += '<div class="bval s5-bval" data-l="' + (b.cx - 84) + '" data-t="' + (b.top - 32) + '" style="left:' + (b.cx - 84) + 'px;top:' + (b.top - 32) + 'px;">' + rows[i + 1][1] + '</div>';
            bh += '<div class="blab s5-blab" data-l="' + (b.cx - 84) + '" data-t="812" style="left:' + (b.cx - 84) + 'px;top:812px;">' + names[i] + '</div>';
          });
          document.getElementById('s5-bars').innerHTML = bh;
          // growth line (chart-local coords)
          const pts = B.map(function (b, i) { return [b.cx - 470, 150 + (12 - growth[i]) * 16]; });
          const d = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0] + ' ' + p[1]; }).join(' ');
          document.getElementById('s5-line').innerHTML = '<path id="s5-lp" d="' + d + '" fill="none" stroke="#F0832A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>' +
            pts.map(function (p, i) { return '<circle class="s5-lc" cx="' + p[0] + '" cy="' + p[1] + '" r="7" fill="#fff" stroke="#F0832A" stroke-width="4"/>'; }).join('');

          function build() {
            const tl = gsap.timeline({ paused: true });
            tl.fromTo('#s5-cam', { scale: 1 }, { scale: 1.035, duration: 9.2, ease: 'sine.inOut' }, 0);

            // ---- chips arrive (continuing from scene 4), title slams in
            C.forEach(function (c, i) {
              tl.set('#s5-c' + i, { x: CP[i][0] - 125, y: CP[i][1] - 26 }, 0);
              tl.to('#s5-c' + i, { x: CP[i][0] - 125 + (960 - CP[i][0]) * 0.12, y: CP[i][1] - 26 + (540 - CP[i][1]) * 0.12, duration: 2.1, ease: 'sine.inOut' }, 0.05);
            });
            tl.fromTo('#s5-title', { scale: 1.3, opacity: 0.15, filter: 'blur(10px)' }, { scale: 1, opacity: 1, filter: 'blur(0px)', duration: 0.55, ease: 'expo.out' }, 0.02);
            tl.fromTo('.s5-tw', { yPercent: 100 }, { yPercent: 0, duration: 0.55, ease: 'expo.out', stagger: 0.08 }, 0.02);
            // title retreats to a heading
            tl.to('#s5-title', { scale: 0.3, x: 0, y: 0, duration: 0.7, ease: 'power3.inOut' }, 2.0);
            tl.to('#s5-title', { opacity: 0, duration: 0.4 }, 4.95);

            // ---- spreadsheet assembles, chips feed it
            tl.fromTo('#s5-sheet', { opacity: 0, scale: 0.9, rotationX: 14, y: 40 }, { opacity: 1, scale: 1, rotationX: 0, y: 0, duration: 0.6, ease: 'power3.out' }, 2.2);
            C.forEach(function (c, i) {
              const tx = 470 + 140 + i * 230, ty = 300 + 150;
              tl.to('#s5-c' + i, { x: tx - 125, y: ty - 26, scale: 0.55, duration: 0.45, ease: 'power3.in' }, 2.3 + i * 0.07);
              tl.to('#s5-c' + i, { opacity: 0, duration: 0.12 }, 2.68 + i * 0.07);
            });
            tl.fromTo('#s5-flash', { opacity: 0 }, { opacity: 1, duration: 0.1 }, 2.75);
            tl.to('#s5-flash', { opacity: 0, duration: 0.5 }, 2.86);
            tl.fromTo('.s5-hd', { opacity: 0 }, { opacity: 1, duration: 0.2, stagger: 0.04 }, 2.6);
            for (let r = 1; r <= 6; r++) tl.fromTo('.s5-r' + r, { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.22, ease: 'power2.out', stagger: 0.05 }, 2.75 + (r - 1) * 0.15);

            // ---- the Sales column lifts out and becomes a bar chart
            tl.to('#s5-sheet', { opacity: 0, scale: 0.94, duration: 0.5, ease: 'power2.inOut' }, 4.0);
            tl.fromTo('#s5-chart', { opacity: 0 }, { opacity: 1, duration: 0.4 }, 4.05);
            tl.fromTo('#s5-axis', { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: 'power3.out' }, 4.1);
            B.forEach(function (b, i) {
              const cellX = 470 + 320, cellY = 300 + 58 + (i + 1) * 66;
              tl.fromTo('#s5-b' + i, { x: cellX - b.left, y: cellY - b.top, scaleX: 240 / 96, scaleY: 60 / b.h, opacity: 0.0, borderRadius: '10px' },
                { opacity: 1, duration: 0.12 }, 3.92 + i * 0.04);
              tl.to('#s5-b' + i, { x: 0, y: 0, scaleX: 1, scaleY: 1, duration: 0.75, ease: 'power3.inOut' }, 3.95 + i * 0.05);
            });
            tl.fromTo('.s5-bval', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.05 }, 4.6);
            tl.fromTo('.s5-blab', { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.05 }, 4.55);
            const lp = document.getElementById('s5-lp'); const L = lp.getTotalLength();
            tl.fromTo(lp, { strokeDasharray: L, strokeDashoffset: L }, { strokeDashoffset: 0, duration: 0.6, ease: 'power2.inOut' }, 4.6);
            tl.fromTo('.s5-lc', { scale: 0, transformOrigin: '50% 50%' }, { scale: 1, duration: 0.25, ease: 'back.out(2)', stagger: 0.1 }, 4.65);

            // ---- the chart drops into a report that builds itself around it
            tl.set('#s5-report', { opacity: 0 }, 0);
            tl.set(['#s5-pg2', '#s5-pg3'], { opacity: 0 }, 0);
            tl.fromTo('#s5-report', { opacity: 0, scale: 0.9, rotationY: -14, y: 40 }, { opacity: 1, scale: 1, rotationY: 0, y: 0, duration: 0.6, ease: 'power3.out' }, 5.0);
            tl.fromTo('#s5-rhead', { clipPath: 'inset(0 100% 0 0 round 20px 20px 0 0)' }, { clipPath: 'inset(0 0% 0 0 round 20px 20px 0 0)', duration: 0.5, ease: 'power3.inOut' }, 5.1);
            // chart + bars group: map to the slot (left 640, top 355, scale .653)
            const S = 640 / 980, ox = 610 + 30, oy = 70 + 285;
            tl.to('#s5-chart', { x: ox - 470, y: oy - 300, scale: S, duration: 0.7, ease: 'power3.inOut' }, 5.05);
            const sub = root.querySelectorAll('.s5-bar, .s5-bval, .s5-blab');
            sub.forEach(function (el) {
              const L0 = +el.dataset.l, T0 = +el.dataset.t;
              tl.to(el, { x: ox + (L0 - 470) * S - L0, y: oy + (T0 - 300) * S - T0, scale: S, transformOrigin: '0 0', duration: 0.7, ease: 'power3.inOut' }, 5.05);
            });
            tl.fromTo(['#s5-k0', '#s5-k1', '#s5-k2'], { opacity: 0, y: 20, rotationX: -40 }, { opacity: 1, y: 0, rotationX: 0, duration: 0.45, ease: 'power3.out', stagger: 0.1 }, 5.35);
            AF.count(tl, document.getElementById('s5-kv0'), 0, 48920, 5.4, 0.9, AF.usd);
            AF.count(tl, document.getElementById('s5-kv1'), 0, 376, 5.5, 0.9, null);
            AF.count(tl, document.getElementById('s5-kv2'), 0, 9, 5.6, 0.9, function (v) { return '+' + Math.round(v) + '%'; });
            tl.fromTo(['#s5-sumh', '#s5-sum1'], { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.35, stagger: 0.12 }, 5.75);
            tl.fromTo('.s5-rl', { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: 'power2.out', stagger: 0.1 }, 5.95);
            tl.fromTo('.s5-bul', { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.35, stagger: 0.12 }, 6.15);
            tl.to('#s5-pg2', { opacity: 1, x: 26, y: 18, duration: 0.5, ease: 'power3.out' }, 6.2);
            tl.to('#s5-pg3', { opacity: 1, x: 52, y: 36, duration: 0.5, ease: 'power3.out' }, 6.3);

            // ---- "not just talk — real work": report slides right, words land left
            tl.to('#s5-report', { x: 380, duration: 0.8, ease: 'power3.inOut' }, 6.75);
            tl.to('#s5-pg2', { x: 380 + 26, duration: 0.8, ease: 'power3.inOut' }, 6.81);
            tl.to('#s5-pg3', { x: 380 + 52, duration: 0.8, ease: 'power3.inOut' }, 6.81);
            // the chart + bars ride along with the report
            tl.to('#s5-chart', { x: ox - 470 + 380, duration: 0.8, ease: 'power3.inOut' }, 6.75);
            sub.forEach(function (el) { tl.to(el, { x: ox + (+el.dataset.l - 470) * S - +el.dataset.l + 380, duration: 0.8, ease: 'power3.inOut' }, 6.75); });
            tl.set(['#s5-t1', '#s5-t2'], { visibility: 'hidden' }, 0);
            tl.set('#s5-t1', { visibility: 'visible' }, 7.15);
            tl.set('#s5-t2', { visibility: 'visible' }, 8.3);
            tl.fromTo('.s5-t1w', { yPercent: 105 }, { yPercent: 0, duration: 0.55, ease: 'expo.out' }, 7.2);
            tl.fromTo('#s5-strike', { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: 'power3.inOut' }, 7.95);
            tl.fromTo('.s5-t2w', { yPercent: 105 }, { yPercent: 0, duration: 0.6, ease: 'expo.out' }, 8.35);
            tl.fromTo('#s5-stamp', { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1, duration: 0.35, ease: 'power3.out' }, 8.5);
            tl.fromTo('#s5-file', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out' }, 8.75);

            // ---- carry everything up into scene 6
            tl.to('#s5-persp', { y: -260, duration: 0.42, ease: 'power4.in' }, 9.36);
            tl.to('#s5-persp', { opacity: 0, duration: 0.3, ease: 'power1.in' }, 9.45);

            AF.allow('#s5 .w, #s5 .wmask, #s5-title, #s5-t1, #s5-t2, #s5-sheet *, #s5-chart *, #s5-bars *, #s5-ctot');
            window.__timelines['s5-action'] = tl;
          }
          if (document.fonts && document.fonts.ready) document.fonts.ready.then(build); else build();
        })();
      </script>
    </template>
  </body>
</html>
