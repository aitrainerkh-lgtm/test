<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phnom Penh Coffee House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=Kantumruy+Pro:wght@500;700&display=swap">
<style>
:root{
  --bg:#E9E3DA;
  --panel:rgba(250,247,242,.93);
  --panel-solid:#FAF7F2;
  --ink:#2A1E17;
  --muted:#6E6159;
  --line:rgba(42,30,23,.13);
  --chip:#EEE6DB;
  --accent:#1E6E62;
  --accent-ink:#FFFFFF;
  --crema:#B8733A;
  --shadow:0 10px 28px rgba(42,30,23,.18);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --khmer:"Kantumruy Pro","Khmer OS Battambang","Leelawadee UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15100D; --panel:rgba(29,22,18,.92); --panel-solid:#1D1612; --ink:#F2E8DD; --muted:#B6A799;
    --line:rgba(242,232,221,.15); --chip:#2C221C; --accent:#5DBFAD; --accent-ink:#0F2420; --crema:#E3A56A;
    --shadow:0 10px 28px rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15100D; --panel:rgba(29,22,18,.92); --panel-solid:#1D1612; --ink:#F2E8DD; --muted:#B6A799;
  --line:rgba(242,232,221,.15); --chip:#2C221C; --accent:#5DBFAD; --accent-ink:#0F2420; --crema:#E3A56A;
  --shadow:0 10px 28px rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
.app{position:relative;height:100%;overflow:hidden;background:#dde7ec}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}
#scene:active{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;background:var(--panel-solid);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px 9px 5px;font:600 12px/1.25 var(--body);white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.16);pointer-events:auto;cursor:pointer;text-align:center}
.lbl small{display:block;font:500 11px/1.2 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.lbl.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.lbl.slim small{display:none}
.dim{position:absolute;left:0;top:0;font:500 12px/1 var(--mono);color:var(--ink);background:var(--panel-solid);border:1px dashed var(--muted);border-radius:6px;padding:4px 7px;white-space:nowrap;font-variant-numeric:tabular-nums}
.dim.street{border-style:solid;letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:var(--muted)}
.top{position:absolute;top:12px;left:16px;right:16px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;pointer-events:none}
.top>*{pointer-events:auto}
.brand{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:9px 16px 11px;box-shadow:var(--shadow)}
.brand .km{font:700 13px/1.35 var(--khmer);color:var(--crema)}
.brand h1{font:800 23px/1.05 var(--display);letter-spacing:-.015em;margin:1px 0 4px;text-wrap:balance}
.brand p{margin:0;color:var(--muted);font-size:12.5px}
.modes{display:flex;gap:4px;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:13px;padding:4px;box-shadow:var(--shadow)}
.modes button{appearance:none;border:0;background:transparent;color:var(--ink);font:600 13.5px/1 var(--body);padding:10px 14px;border-radius:9px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px}
.modes button svg{width:17px;height:17px;flex:none}
.modes button:hover{background:var(--chip)}
.modes button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.modes .short{display:none}
button:focus-visible{outline:2px solid var(--crema);outline-offset:2px}
.panel{position:absolute;right:16px;top:98px;width:320px;max-height:calc(100% - 160px);display:flex;flex-direction:column;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 12px 11px 16px;border-bottom:1px solid var(--line)}
.panel-head h2{margin:0;font:700 16px/1.2 var(--display);letter-spacing:-.005em}
.panel-head .sub{display:block;font:400 12.5px/1.3 var(--body);color:var(--muted);margin-top:2px}
.icon-btn{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);width:32px;height:32px;border-radius:8px;cursor:pointer;display:grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--chip)}
.icon-btn svg{width:16px;height:16px;transition:transform .2s}
.panel.collapsed .icon-btn svg{transform:rotate(180deg)}
.panel-body{overflow:auto;padding:12px 12px 14px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font:600 11px/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 4px 8px}
.floors{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.floors button{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:600 13px/1.1 var(--body);padding:9px 4px 8px;border-radius:9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.floors button small{font:500 11px/1 var(--mono);color:var(--muted)}
.floors button[aria-pressed="true"]{background:var(--ink);color:var(--panel-solid);border-color:var(--ink)}
.floors button[aria-pressed="true"] small{color:inherit;opacity:.75}
.list{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.item{appearance:none;width:100%;text-align:left;display:grid;grid-template-columns:1fr auto;gap:1px 10px;padding:8px 10px 9px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--ink);cursor:pointer;font:inherit}
.item:hover{background:var(--chip)}
.item.active{background:var(--chip);border-color:var(--accent)}
.item .nm{font-weight:600}
.item .m2{font:500 12.5px/1.4 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;align-self:start}
.item .nt{grid-column:1/-1;color:var(--muted);font-size:12.5px;line-height:1.35}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 4px;font-size:13px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.keys{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;margin:0 4px;font-size:13px;align-items:center}
.keys kbd{font:500 11.5px/1 var(--mono);background:var(--chip);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:3px 6px;white-space:nowrap}
.foot{font-size:12px;color:var(--muted);margin:0 4px}
.hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:13px;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where{position:absolute;left:16px;bottom:16px;background:var(--ink);color:var(--panel-solid);border-radius:10px;padding:8px 12px;font:600 13px/1.2 var(--body);box-shadow:var(--shadow);pointer-events:none}
.where small{display:block;font:500 11px/1.3 var(--body);opacity:.7;letter-spacing:.06em;text-transform:uppercase}
.joy{position:absolute;left:20px;bottom:96px;width:124px;height:124px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.7);touch-action:none;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.joy .knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.fail{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;background:var(--bg);color:var(--ink);font-size:15px}
@media (max-width:760px){
  .top{flex-direction:column;align-items:stretch;gap:8px;top:10px}
  .brand{padding:7px 12px 8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .brand h1{font-size:18px;margin:0}
  .brand p{display:none}
  .modes button{flex:1;justify-content:center;padding:9px 6px;font-size:12.5px;gap:6px}
  .modes .long{display:none}
  .modes .short{display:inline}
  .panel{left:16px;right:16px;width:auto;top:auto;bottom:12px;max-height:40%}
  .hint{bottom:auto;top:118px;font-size:12px;white-space:normal;border-radius:12px}
  .where{left:auto;right:16px;bottom:84px}
  .joy{bottom:84px}
}
@media (prefers-reduced-motion: reduce){ .icon-btn svg{transition:none} }
</style>

<div class="app">
  <canvas id="scene" tabindex="0" aria-label="3D model of a three-storey coffee shop in Phnom Penh"></canvas>
  <div id="labels"></div>

  <div class="top">
    <div class="brand">
      <div class="km">ហាងកាហ្វេ</div>
      <h1>Coffee House</h1>
      <p>Phnom Penh · 3 floors · 10 m × 14 m corner lot</p>
    </div>
    <nav class="modes" id="modes" aria-label="View mode">
      <button data-mode="exterior" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 21V8l8-5 8 5v13"/><path d="M9 21v-6h6v6"/><path d="M2 21h20"/></svg>
        <span class="long">Exterior</span><span class="short">Outside</span></button>
      <button data-mode="floors" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/><path d="M3 17.5l9 5 9-5"/></svg>
        <span class="long">3D Floors</span><span class="short">3D</span></button>
      <button data-mode="plan" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M3 12h7v9"/><path d="M14 3v6h7"/></svg>
        <span class="long">Floor Plans</span><span class="short">Plans</span></button>
      <button data-mode="walk" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"/><path d="M9 21l2.5-6.5L14 17v4"/><path d="M8 11l3-3.5 3.5 2 2.5 3"/><path d="M11.5 14.5L11 7.5"/></svg>
        <span class="long">Walk Through</span><span class="short">Walk</span></button>
    </nav>
  </div>

  <aside class="panel" id="panel">
    <div class="panel-head">
      <div><h2 id="panelTitle">Views</h2><span class="sub" id="panelSub"></span></div>
      <button class="icon-btn" id="collapse" aria-expanded="true" aria-label="Hide panel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>
    <div class="panel-body" id="panelBody">
      <div id="floorBlock">
        <p class="eyebrow" id="floorEyebrow">Floor</p>
        <div class="floors" id="floors"></div>
      </div>
      <div>
        <p class="eyebrow" id="listEyebrow">Areas</p>
        <ul class="list" id="list"></ul>
      </div>
      <div id="extra"></div>
    </div>
  </aside>

  <div class="hint" id="hint"></div>
  <div class="where" id="where" hidden></div>
  <div class="joy" id="joy" hidden><div class="knob"></div></div>
  <div class="fail" id="fail" hidden>This 3D model needs WebGL. Open it in a current version of Chrome, Edge, Safari or Firefox.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
'use strict';
const FH = 3.6;          // floor-to-floor height (m)
const WH = 3.4;          // wall height under the slab above
const LEVEL_NAMES = ['Ground Floor','First Floor','Second Floor'];
const LEVEL_SHORT = ['Ground','1st','2nd'];
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse = matchMedia('(pointer: coarse)').matches;
const $ = s => document.querySelector(s);
const canvas = $('#scene');

if (!window.THREE) { $('#fail').hidden = false; return; }
let renderer;
try { renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'}); }
catch (e) { $('#fail').hidden = false; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 420);
camera.rotation.order = 'YXZ';
const ortho = new THREE.OrthographicCamera(-10, 10, 10, -10, 0.1, 200);

/* ---------------- procedural textures ---------------- */
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());
function mkTex(w, h, draw, repeat = true){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.encoding = THREE.sRGBEncoding; t.anisotropy = maxAniso;
  t.userData = {draw, canvas:c};
  return t;
}
function redraw(t){ const c = t.userData.canvas, g = c.getContext('2d'); g.clearRect(0,0,c.width,c.height); t.userData.draw(g, c.width, c.height); t.needsUpdate = true; }
function noise(g, w, h, n, base, spread, seed, size = 2){
  const R = rng(seed);
  for (let i = 0; i < n; i++){ const v = base + (R() - .5) * spread; g.fillStyle = `rgb(${v|0},${v|0},${v|0})`; g.globalAlpha = .35 + R() * .4; g.fillRect(R()*w, R()*h, size, size); }
  g.globalAlpha = 1;
}

const tSky = mkTex(4, 512, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, '#6fa6d3'); gr.addColorStop(.55, '#b9d3e4'); gr.addColorStop(1, '#efe6d6');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
}, false);

const tTerrazzo = mkTex(512, 512, (g, w, h) => {
  const R = rng(7); g.fillStyle = '#e1dbd1'; g.fillRect(0, 0, w, h);
  const cols = ['#9a8f82','#c3b7a7','#f8f5ef','#6f8f86','#c9946a','#55504a','#d9c9b0'];
  for (let i = 0; i < 2600; i++){
    const x = R()*w, y = R()*h, r = 1 + R()*R()*7, e = .45 + R()*.55, a = R()*Math.PI, c = cols[(R()*cols.length)|0];
    g.fillStyle = c;
    for (const dx of [-w, 0, w]) for (const dy of [-h, 0, h]){ g.beginPath(); g.ellipse(x+dx, y+dy, r, r*e, a, 0, 7); g.fill(); }
  }
});
const tWood = mkTex(512, 512, (g, w, h) => {
  const R = rng(11), rows = 12, rh = h / rows;
  for (let r = 0; r < rows; r++){
    let x = -R()*220;
    while (x < w){
      const len = 150 + R()*260, t = R();
      g.fillStyle = `rgb(${(168+t*38)|0},${(118+t*28)|0},${(76+t*20)|0})`; g.fillRect(x, r*rh, len, rh);
      g.strokeStyle = 'rgba(70,40,20,.18)'; g.lineWidth = 1;
      for (let k = 0; k < 7; k++){ const y = r*rh + 2 + R()*(rh-4); g.beginPath(); g.moveTo(x, y); g.bezierCurveTo(x+len*.3, y+(R()-.5)*6, x+len*.7, y+(R()-.5)*6, x+len, y); g.stroke(); }
      g.fillStyle = 'rgba(50,30,15,.45)'; g.fillRect(x, r*rh, 2, rh);
      x += len;
    }
    g.fillStyle = 'rgba(50,30,15,.4)'; g.fillRect(0, r*rh, w, 1.5);
  }
});
const tCement = mkTex(256, 256, (g, w) => {
  const s = w / 2;
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++){
    const x = i*s, y = j*s; g.save(); g.beginPath(); g.rect(x, y, s, s); g.clip();
    g.fillStyle = '#ece4d6'; g.fillRect(x, y, s, s);
    for (const [cx, cy] of [[x,y],[x+s,y],[x,y+s],[x+s,y+s]]){
      g.fillStyle = '#2f6f68'; g.beginPath(); g.arc(cx, cy, s*.34, 0, 7); g.fill();
      g.fillStyle = '#ece4d6'; g.beginPath(); g.arc(cx, cy, s*.22, 0, 7); g.fill();
      g.fillStyle = '#c0714a'; g.beginPath(); g.arc(cx, cy, s*.1, 0, 7); g.fill();
    }
    g.fillStyle = '#c0714a'; g.beginPath(); g.moveTo(x+s/2, y+s*.24); g.lineTo(x+s*.76, y+s/2); g.lineTo(x+s/2, y+s*.76); g.lineTo(x+s*.24, y+s/2); g.closePath(); g.fill();
    g.fillStyle = '#ece4d6'; g.beginPath(); g.arc(x+s/2, y+s/2, s*.07, 0, 7); g.fill();
    g.strokeStyle = '#cdbfae'; g.lineWidth = 2; g.strokeRect(x+1, y+1, s-2, s-2);
    g.restore();
  }
});
const tKTile = mkTex(256, 256, (g, w, h) => {
  g.fillStyle = '#d5d8d5'; g.fillRect(0, 0, w, h); noise(g, w, h, 900, 200, 40, 3);
  g.strokeStyle = '#a9aeab'; g.lineWidth = 3;
  for (const p of [1.5, w/2, w-1.5]){ g.beginPath(); g.moveTo(p, 0); g.lineTo(p, h); g.stroke(); g.beginPath(); g.moveTo(0, p); g.lineTo(w, p); g.stroke(); }
});
const tBreeze = mkTex(256, 256, (g, w, h) => {
  g.fillStyle = '#ece3d3'; g.fillRect(0, 0, w, h);
  g.globalCompositeOperation = 'destination-out';
  g.beginPath(); g.arc(w/2, h/2, w*.3, 0, 7); g.fill();
  for (const [cx, cy] of [[0,0],[w,0],[0,h],[w,h]]){ g.beginPath(); g.arc(cx, cy, w*.2, 0, 7); g.fill(); }
  g.globalCompositeOperation = 'source-over';
  g.strokeStyle = 'rgba(120,100,78,.45)'; g.lineWidth = 5; g.beginPath(); g.arc(w/2, h/2, w*.3, 0, 7); g.stroke();
  g.strokeStyle = '#cdbfa9'; g.lineWidth = 6; g.strokeRect(3, 3, w-6, h-6);
});
const tAsphalt = mkTex(256, 256, (g, w, h) => { g.fillStyle = '#575a5c'; g.fillRect(0, 0, w, h); noise(g, w, h, 5000, 90, 60, 5); });
const tPaving = mkTex(256, 256, (g, w) => {
  const R = rng(9), s = w/2;
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++){ const v = 196 + R()*18; g.fillStyle = `rgb(${v|0},${(v-6)|0},${(v-16)|0})`; g.fillRect(i*s, j*s, s, s); }
  noise(g, w, w, 1500, 170, 60, 4);
  g.strokeStyle = '#9d968b'; g.lineWidth = 3;
  for (const p of [1.5, s, w-1.5]){ g.beginPath(); g.moveTo(p, 0); g.lineTo(p, w); g.stroke(); g.beginPath(); g.moveTo(0, p); g.lineTo(w, p); g.stroke(); }
});
const tGround = mkTex(256, 256, (g, w, h) => { g.fillStyle = '#b3aa96'; g.fillRect(0, 0, w, h); noise(g, w, h, 3000, 160, 50, 8, 3); });
const tAwning = mkTex(256, 64, (g, w, h) => { for (let i = 0; i < 8; i++){ g.fillStyle = i % 2 ? '#efe6d6' : '#2f6f68'; g.fillRect(i*w/8, 0, w/8, h); } });
const tFacade = mkTex(256, 256, (g, w, h) => {
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#e4ded5'; g.fillRect(0, h*.9, w, h*.1);

const STAGE = {};
function add(g, m, L, matrix){ const k = L + '|' + m; (STAGE[k] || (STAGE[k] = {mat:m, level:L, items:[]})).items.push({g, m:matrix}); }
const _q = new THREE.Quaternion(), _e = new THREE.Euler(), _p = new THREE.Vector3(), _s = new THREE.Vector3();
function M4(x, y, z, sx, sy, sz, ry = 0, rx = 0, rz = 0){ _e.set(rx, ry, rz, 'YXZ'); _q.setFromEuler(_e); return new THREE.Matrix4().compose(_p.set(x, y, z), _q, _s.set(sx, sy, sz)); }
function B(L, m, x, y, z, sx, sy, sz, ry = 0, rx = 0){ add('box', m, L, M4(x, y, z, sx, sy, sz, ry, rx)); }
function Bx(L, m, x0, x1, y0, y1, z0, z1){ B(L, m, (x0+x1)/2, (y0+y1)/2, (z0+z1)/2, x1-x0, y1-y0, z1-z0); }
function C(L, m, x, y, z, r, h, g = 'cyl'){ add(g, m, L, M4(x, y, z, r*2, h, r*2)); }
function S(L, m, x, y, z, r, g = 'sph', sy = 1){ add(g, m, L, M4(x, y, z, r*2, r*2*sy, r*2)); }
function Fr(x, y, z, ry){
  const P = M4(x, y, z, 1, 1, 1, ry), at = mm => P.clone().multiply(mm);
  return {
    b(L, m, lx, ly, lz, sx, sy, sz, lry = 0, lrx = 0){ add('box', m, L, at(M4(lx, ly, lz, sx, sy, sz, lry, lrx))); },
    c(L, m, lx, ly, lz, r, h){ add('cyl', m, L, at(M4(lx, ly, lz, r*2, h, r*2))); },
    raw(g, L, m, mm){ add(g, m, L, at(mm)); }
  };
}

/* colliders: axis-aligned boxes with a height range */
const COL = [];
function col(x0, x1, z0, z1, y0, y1){ COL.push({x0:Math.min(x0,x1), x1:Math.max(x0,x1), z0:Math.min(z0,z1), z1:Math.max(z0,z1), y0, y1}); }
function colR(x, z, hw, hd, ry, y0, y1){ const sw = Math.abs(Math.sin(ry)) > .7, a = sw ? hd : hw, b = sw ? hw : hd; col(x-a, x+a, z-b, z+b, y0, y1); }

const SEATS = [0, 0, 0];
const face = (x, z, tx, tz) => Math.atan2(tx - x, tz - z);

/* ---------------- building blocks ---------------- */
// wall along an axis: axis 'x' => runs along x at z in [c0,c1]; axis 'z' => runs along z at x in [c0,c1]
function wall(L, axis, c0, c1, a0, a1, ops, m = 'plaster', h = WH){
  const yb = L*FH, cc = (c0+c1)/2, t = c1 - c0;
  const piece = (mm, a, b, y0, y1, th, collide = true) => {
    if (b - a < 1e-3 || y1 - y0 < 1e-3) return;
    const ac = (a+b)/2, len = b - a, yc = yb + (y0+y1)/2, hh = y1 - y0;
    if (axis === 'x') B(L, mm, ac, yc, cc, len, hh, th); else B(L, mm, cc, yc, ac, th, hh, len);
    if (collide){ if (axis === 'x') col(a, b, c0, c1, yb+y0, yb+y1); else col(c0, c1, a, b, yb+y0, yb+y1); }
  };
  const fr = (a, b, y0, y1, w, d) => piece('frame', a, b, y0, y1, d, false);
  ops = (ops || []).slice().sort((p, q) => p.a - q.a);
  let cur = a0;
  for (const o of ops){
    piece(m, cur, o.a, 0, h, t);
    piece(m, o.a, o.b, 0, o.y0, t);
    piece(m, o.a, o.b, o.y1, h, t);
    if (o.k === 'glass'){
      piece('glass', o.a, o.b, o.y0, o.y1, .03, false);
      if (axis === 'x') col(o.a, o.b, c0, c1, yb+o.y0, yb+o.y1); else col(c0, c1, o.a, o.b, yb+o.y0, yb+o.y1);
      fr(o.a, o.b, o.y0, o.y0+.06, 0, .07); fr(o.a, o.b, o.y1-.06, o.y1, 0, .07);
      const w = o.b - o.a, n = Math.max(1, Math.round(w/1.25));
      for (let i = 0; i <= n; i++){ const p = o.a + i*w/n; fr(Math.max(o.a, p-.03), Math.min(o.b, p+.03), o.y0, o.y1, 0, .07); }
    } else if (o.k === 'breeze'){
      piece('breeze', o.a, o.b, o.y0, o.y1, .14);
    }
    cur = o.b;
  }
  piece(m, cur, a1, 0, h, t);
}
function slab(L){
  const y = L*FH;
  if (L === 0){ Bx(0, 'concrete', -5, 5, -.2, 0, -7, 7); return; }
  const m = 'band', a = y - .2;
  Bx(L, m, -5, 5, a, y, -3.2, 7); Bx(L, m, -2.3, 5, a, y, -7, -3.2);
  Bx(L, m, -5, -4.8, a, y, -7, -3.2); Bx(L, m, -4.8, -2.3, a, y, -7, -6.8);
}
function finish(L, m, x0, x1, z0, z1){ Bx(L, m, x0, x1, L*FH, L*FH + .012, z0, z1); }
function stairs(L){
  const b = L*FH;
  for (let i = 0; i < 10; i++){
    const t1 = b + (i+1)*.18;
    Bx(L, 'terrazzo', -4.8, -3.6, Math.max(b, t1-.36), t1, -3.2-(i+1)*.24, -3.2-i*.24);
    const t2 = b + 1.8 + (i+1)*.18;
    Bx(L, 'terrazzo', -3.5, -2.3, t2-.36, t2, -5.6+i*.24, -5.6+(i+1)*.24);
  }
  Bx(L, 'terrazzo', -4.8, -2.3, b+1.6, b+1.8, -6.8, -5.6);
  // handrail on the centre wall
  const hr = (x, z0, z1, y0, y1) => { const len = Math.hypot(z1-z0, y1-y0); add('box', 'steel', L, M4(x, (y0+y1)/2 + .9, (z0+z1)/2, .05, .05, len, 0, Math.atan2(y1-y0, z0-z1))); };
  hr(-3.66, -3.2, -5.6, b, b+1.8);
  hr(-3.44, -5.6, -3.2, b+1.8, b+3.6);
}
function core(L){
  wall(L, 'z', -2.3, -2.2, -6.8, -3.2, []);
  const top = L < 2 ? (L+1)*FH : L*FH + 1.0;
  Bx(L, 'plaster', -3.6, -3.5, L*FH, top, -5.6, -3.2); col(-3.6, -3.5, -5.6, -3.2, L*FH, top);
  if (L < 2) stairs(L);
}

/* furniture */
function chair(L, x, z, ry, m = 'wood'){
  const y = L*FH, f = Fr(x, y, z, ry);
  f.b(L, m, 0, .46, 0, .44, .04, .42); f.b(L, m, 0, .78, -.19, .42, .34, .04);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) f.b(L, 'metalDark', sx*.18, .23, sz*.17, .03, .46, .03);
  SEATS[L]++;
}
function stool(L, x, z, h = .75){
  const y = L*FH;
  C(L, 'leather', x, y+h, z, .19, .06); C(L, 'metalDark', x, y+h/2, z, .025, h);
  C(L, 'metalDark', x, y+.015, z, .2, .03); C(L, 'metalDark', x, y+.3, z, .14, .02);
  SEATS[L]++;
}
function table(L, x, z, w, d, o = {}){
  const y = L*FH, h = o.h || .75, top = o.top || 'woodLight', legs = o.legs || 'metalDark';
  if (o.round){
    C(L, top, x, y+h-.02, z, w/2, .04); C(L, legs, x, y+h/2, z, .03, h); C(L, legs, x, y+.015, z, Math.min(.25, w*.4), .03);
    col(x-w*.35, x+w*.35, z-w*.35, z+w*.35, y, y+h);
  } else {
    B(L, top, x, y+h-.02, z, w, .04, d);
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) B(L, legs, x+sx*(w/2-.05), y+(h-.04)/2, z+sz*(d/2-.05), .04, h-.04, .04);
    col(x-w/2+.04, x+w/2-.04, z-d/2+.04, z+d/2-.04, y, y+h);
  }
}
function set2(L, x, z, axis = 'z', o = {}){
  table(L, x, z, .7, .7, o);
  const cm = o.chair || 'wood';
  if (axis === 'z'){ chair(L, x, z-.55, 0, cm); chair(L, x, z+.55, Math.PI, cm); }
  else { chair(L, x-.55, z, Math.PI/2, cm); chair(L, x+.55, z, -Math.PI/2, cm); }
}
function set4(L, x, z, o = {}){
  table(L, x, z, .85, .85, o); const cm = o.chair || 'wood';
  chair(L, x, z-.62, 0, cm); chair(L, x, z+.62, Math.PI, cm); chair(L, x-.62, z, Math.PI/2, cm); chair(L, x+.62, z, -Math.PI/2, cm);
}
function sofa(L, x, z, ry, w, m, seats){
  const y = L*FH, f = Fr(x, y, z, ry);
  f.b(L, m, 0, .24, .02, w, .3, .8); f.b(L, m, 0, .44, .06, w-.36, .12, .7);
  f.b(L, m, 0, .64, -.32, w, .5, .2);
  for (const s of [-1, 1]) f.b(L, m, s*(w/2-.09), .44, .02, .18, .36, .8);
  f.b(L, 'metalDark', 0, .045, 0, w-.12, .09, .7);
  colR(x, z, w/2, .42, ry, y, y+.9);
  SEATS[L] += seats != null ? seats : Math.max(1, Math.round((w-.36)/.6));
}
function plant(L, x, z, s = 1, tall = false){
  const y = typeof L === 'number' ? L*FH : 0, R = rng(Math.round((x*31 + z*17) * 100));
  C(L, 'pot', x, y+.22*s, z, .2*s, .44*s); C(L, 'soil', x, y+.44*s, z, .18*s, .01);
  if (tall){
    C(L, 'trunk', x, y+.9*s, z, .025*s, 1.0*s);
    for (let i = 0; i < 4; i++) S(L, i % 2 ? 'leaf2' : 'leaf', x+(R()-.5)*.4*s, y+(1.2+i*.22)*s, z+(R()-.5)*.4*s, (.26+R()*.1)*s, 'lo');
  } else {
    S(L, 'leaf', x, y+.72*s, z, .32*s, 'lo'); S(L, 'leaf2', x+.14*s, y+.86*s, z-.08*s, .22*s, 'lo');
  }
  col(x-.2*s, x+.2*s, z-.2*s, z+.2*s, y, y+1.2*s);
}
function pendant(L, x, z, drop = .9){
  const top = L*FH + WH, o = 'o' + L;
  Bx(o, 'metalDark', x-.006, x+.006, top-drop, top, z-.006, z+.006);
  add('shade', 'brass', o, M4(x, top-drop-.11, z, .36, .22, .36));

}
const LIGHTS = [];
function plight(L, x, y, z, i = .55, d = 9){ const l = new THREE.PointLight(0xffd9a8, i, d, 2); l.position.set(x, L*FH + y, z); scene.add(l); LIGHTS.push({l, L, base:i}); }

  if (foot && !inHole(x, z)){ s.push(FH, 2*FH); }
  if (x > -4 && x < 4 && z >= 7 && z < 8.6) s.push(FH);
  for (let L = 0; L < 2; L++){
    const b = L*FH;
    if (x > -4.8 && x < -3.6 && z <= -3.2 && z > -5.6) s.push(b + 1.8*((-3.2 - z)/2.4));
    if (x > -3.5 && x < -2.3 && z <= -3.2 && z > -5.6) s.push(b + 1.8 + 1.8*((z + 5.6)/2.4));
    if (x > -4.8 && x < -2.3 && z <= -5.6 && z > -6.8) s.push(b + 1.8);
  }
  let best = -Infinity; for (const v of s) if (v <= y + .55 && v > best) best = v;
  return best === -Infinity ? 0 : best;
}
function collide(x, z, y){
  const r = .28, b0 = y + .4, b1 = y + 1.75;
  for (let it = 0; it < 3; it++){
    for (const c of COL){
      if (c.y1 <= b0 || c.y0 >= b1) continue;
      if (x < c.x0 - r || x > c.x1 + r || z < c.z0 - r || z > c.z1 + r) continue;
      const px = Math.max(c.x0, Math.min(x, c.x1)), pz = Math.max(c.z0, Math.min(z, c.z1));
      const dx = x - px, dz = z - pz, d2 = dx*dx + dz*dz;
      if (d2 >= r*r) continue;
      if (d2 > 1e-8){ const d = Math.sqrt(d2); x = px + dx/d*r; z = pz + dz/d*r; }
      else { const l = x - c.x0, rr = c.x1 - x, t = z - c.z0, bb = c.z1 - z, m = Math.min(l, rr, t, bb);
        if (m === l) x = c.x0 - r; else if (m === rr) x = c.x1 + r; else if (m === t) z = c.z0 - r; else z = c.z1 + r; }
    }
  }
  return [Math.max(-40, Math.min(40, x)), Math.max(-20, Math.min(22, z))];
}
function blocked(x, z, y){ const [a, b] = collide(x, z, y); return Math.abs(a - x) > .01 || Math.abs(b - z) > .01; }
const keys = {};
const joy = {x:0, y:0};
function stepWalk(dt){
  let f = 0, s = 0;
  if (keys.KeyW || keys.ArrowUp) f += 1; if (keys.KeyS || keys.ArrowDown) f -= 1;
  if (keys.KeyD || keys.ArrowRight) s += 1; if (keys.KeyA || keys.ArrowLeft) s -= 1;
  f += -joy.y; s += joy.x;
  const len = Math.hypot(f, s); if (len > 1){ f /= len; s /= len; }
  const sp = (keys.ShiftLeft || keys.ShiftRight) ? 4.2 : 2.1, sy = Math.sin(W.yaw), cy = Math.cos(W.yaw);
  if (f || s){
    const [nx, nz] = collide(W.x + (-sy*f + cy*s)*sp*dt, W.z + (-cy*f - sy*s)*sp*dt, W.y);
    W.x = nx; W.z = nz;
  }
  const g = groundAt(W.x, W.z, W.y);
  if (g >= W.y) W.y = g; else W.y = Math.max(g, W.y - 6*dt);
  W.eye += (W.y + 1.62 - W.eye) * Math.min(1, dt*12);
  camera.position.set(W.x, W.eye, W.z); camera.rotation.set(W.pitch, W.yaw, 0, 'YXZ');
}
function teleport(x, y, z, yaw){ W.x = x; W.y = y; W.z = z; W.eye = y + 1.62; W.yaw = yaw; W.pitch = -.05; }
const TELE = [[0, 0, 10.8, 0], [-2.9, FH, -2.4, Math.PI], [-2.9, 2*FH, -2.6, Math.PI]];
function walkToArea(a){
  const y = a.L*FH; let best = [a.cx, a.cz];
  outer: for (let r = 0; r < 3; r += .25) for (let k = 0; k < 12; k++){
    const x = a.cx + Math.cos(k*Math.PI/6)*r, z = a.cz + Math.sin(k*Math.PI/6)*r;
    if (x < a.r[0] + .3 || x > a.r[1] - .3 || z < a.r[2] + .3 || z > a.r[3] - .3) continue;
    if (!blocked(x, z, y)){ best = [x, z]; break outer; }
  }
  const yaw = Math.hypot(best[0], best[1]) < .5 ? Math.PI : Math.atan2(best[0], best[1]);
  teleport(best[0], y, best[1], yaw);
}
function levelOf(y){ return y < 1.9 ? 0 : y < 5.5 ? 1 : 2; }
function whereAmI(){
  const L = levelOf(W.y);
  if (W.x > -4.8 && W.x < -2.3 && W.z > -6.8 && W.z < -3.2) return ['Stair', LEVEL_NAMES[L]];
  for (const a of AREAS) if (a.L === L && W.x >= a.r[0] && W.x <= a.r[1] && W.z >= a.r[2] && W.z <= a.r[3]) return [a.name, LEVEL_NAMES[L]];
  if (L === 0 && (W.x < -5 || W.x > 5 || W.z > 7 || W.z < -7)) return ['Street', 'Outside'];
  return [LEVEL_NAMES[L], 'Inside'];
}

/* ---------- labels ---------- */
const labelsEl = $('#labels');
AREAS.forEach(a => {
  const el = document.createElement('div'); el.className = 'lbl'; el.hidden = true;
  el.innerHTML = `${a.name}<small>${a.m2.toFixed(1)} m²</small>`;
  el.addEventListener('click', () => focusArea(a));
  labelsEl.appendChild(el); a.el = el;
});
const DIMS = [
  {t:'10.0 m', p:[0, -7.55]}, {t:'14.0 m', p:[-5.75, 0]},
  {t:'Main street', p:[0, 15.9], street:true}, {t:'Side street', p:[-11.4, -2], street:true}
].map(d => { const el = document.createElement('div'); el.className = 'dim' + (d.street ? ' street' : ''); el.textContent = d.t; el.hidden = true; labelsEl.appendChild(el); return Object.assign(d, {el}); });
const _v = new THREE.Vector3();
function place(el, x, y, z, cam, w, h){
  _v.set(x, y, z).project(cam);
  if (_v.z > 1 || _v.z < -1 || Math.abs(_v.x) > 1.1 || Math.abs(_v.y) > 1.1){ if (!el.hidden) el.hidden = true; return; }
  el.hidden = false;
  el.style.transform = `translate(${((_v.x*.5 + .5)*w).toFixed(1)}px,${((-_v.y*.5 + .5)*h).toFixed(1)}px) translate(-50%,-50%)`;
}
function updateLabels(cam){
  const w = canvas.clientWidth, h = canvas.clientHeight, show = mode === 'floors' || mode === 'plan';
  for (const a of AREAS){
    if (!show || a.L !== floor){ if (!a.el.hidden) a.el.hidden = true; continue; }
    place(a.el, a.cx, a.L*FH + (mode === 'plan' ? .3 : 1.3), a.cz, cam, w, h);
  }
  for (const d of DIMS){
    if (mode !== 'plan'){ if (!d.el.hidden) d.el.hidden = true; continue; }
    place(d.el, d.p[0], floor*FH + .3, d.p[1], cam, w, h);
  }
}

/* ---------- panel UI ---------- */
const floorsEl = $('#floors'), listEl = $('#list'), extraEl = $('#extra');
function seatsTotal(){ return SEATS[0] + SEATS[1] + SEATS[2]; }
LEVEL_SHORT.forEach((n, L) => {
  const b = document.createElement('button'); b.type = 'button';
  b.innerHTML = `${n}<small>${SEATS[L]} seats</small>`;
  b.addEventListener('click', () => setFloor(L));
  floorsEl.appendChild(b);
});
function item(name, right, note, active, onClick){
  const li = document.createElement('li'), b = document.createElement('button');
  b.type = 'button'; b.className = 'item' + (active ? ' active' : '');
  b.innerHTML = `<span class="nm"></span><span class="m2"></span><span class="nt"></span>`;
  b.querySelector('.nm').textContent = name; b.querySelector('.m2').textContent = right; b.querySelector('.nt').textContent = note;
  b.addEventListener('click', onClick); li.appendChild(b); return li;
}
function renderPanel(){
  const titles = {exterior:['Exterior views', 'Pick a viewpoint, then drag to look around'], floors:['3D Floors', LEVEL_NAMES[floor] + ' · floors above hidden'], plan:['Floor Plans', LEVEL_NAMES[floor] + ' · top-down plan'], walk:['Walk Through', 'First-person view at eye level']};
  $('#panelTitle').textContent = titles[mode][0]; $('#panelSub').textContent = titles[mode][1];
  $('#floorBlock').hidden = mode === 'exterior';
  $('#floorEyebrow').textContent = mode === 'walk' ? 'Go to floor' : 'Floor';
  [...floorsEl.children].forEach((b, L) => b.setAttribute('aria-pressed', String(L === (mode === 'walk' ? levelOf(W.y) : floor))));
  listEl.innerHTML = '';
  if (mode === 'exterior'){
    $('#listEyebrow').textContent = 'Viewpoints';
    VIEWS.forEach((v, i) => listEl.appendChild(item(v.name, '', v.nt, i === activeView, () => { activeView = i; flyTo(v.p, v.t); renderPanel(); })));
    extraEl.innerHTML = `<p class="eyebrow">Building</p><dl class="facts">
      <dt>Floors</dt><dd>3 + roof deck for services</dd>
      <dt>Plot</dt><dd>10 m frontage × 14 m depth</dd>
      <dt>Built area</dt><dd>420 m² + 12.8 m² balcony</dd>
      <dt>Seats</dt><dd>${seatsTotal()} (G ${SEATS[0]} · 1st ${SEATS[1]} · 2nd ${SEATS[2]})</dd>
      <dt>Floor height</dt><dd>3.6 m</dd></dl>
      <p class="foot">Concept model by AI For Business</p>`;
  } else {
    $('#listEyebrow').textContent = mode === 'walk' ? 'Walk to an area' : 'Areas on this floor';
    AREAS.filter(a => a.L === floor).forEach(a => listEl.appendChild(item(a.name, a.m2.toFixed(1) + ' m²', a.nt, a === activeArea, () => focusArea(a))));
    if (mode === 'walk'){
      extraEl.innerHTML = coarse
        ? `<p class="eyebrow">Controls</p><dl class="keys"><dt><kbd>Left stick</kbd></dt><dd>Walk</dd><dt><kbd>Drag</kbd></dt><dd>Look around</dd><dt><kbd>Stair</kbd></dt><dd>Back left corner, walk up or down</dd></dl>`
        : `<p class="eyebrow">Controls</p><dl class="keys"><dt><kbd>W A S D</kbd></dt><dd>Walk (or arrow keys)</dd><dt><kbd>Drag</kbd></dt><dd>Look around</dd><dt><kbd>Shift</kbd></dt><dd>Hold to walk faster</dd><dt><kbd>Stair</kbd></dt><dd>Back left corner, walk up or down</dd></dl>`;
    } else {
      extraEl.innerHTML = `<dl class="facts"><dt>Gross floor area</dt><dd>${FLOOR_AREA} m²${floor === 1 ? ' + 12.8 m² balcony' : ''}</dd><dt>Seats</dt><dd>${SEATS[floor]}</dd><dt>Ceiling height</dt><dd>3.4 m clear</dd></dl>`;
    }
  }
  AREAS.forEach(a => { a.el.classList.toggle('active', a === activeArea); a.el.classList.toggle('slim', mode !== 'plan'); });
}
const HINTS = {
  exterior: coarse ? 'Drag to orbit · Pinch to zoom · Two fingers to pan' : 'Drag to orbit · Scroll to zoom · Right-drag to pan',
  floors: coarse ? 'Floors above are hidden · Tap an area label to fly there' : 'Floors above are hidden · Click an area label to fly there · Drag to orbit',
  plan: coarse ? 'Drag to pan · Pinch to zoom · Street is at the bottom' : 'Drag to pan · Scroll to zoom · Street is at the bottom',
  walk: coarse ? 'Left stick to walk · Drag to look around' : 'W A S D to walk · Drag to look · Shift to walk faster'
};

function setMode(m, instant){
  const prev = mode; mode = m; activeArea = null; tween = null;
  document.querySelectorAll('#modes button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
  $('#hint').textContent = HINTS[m];
  $('#where').hidden = m !== 'walk';
  $('#joy').hidden = !(m === 'walk' && coarse);
  canvas.style.cursor = m === 'walk' ? 'crosshair' : m === 'plan' ? 'move' : '';
  if (m === 'walk'){
    controls.enabled = false; camera.fov = 70; camera.updateProjectionMatrix(); applyCut(3, false);
    if (prev !== 'walk'){ const L = prev === 'exterior' ? 0 : floor; teleport(...TELE[L]); floor = L; }
    lastLevel = -1;
    if (coarse) setCollapsed(true);
  } else {
    camera.fov = 50; camera.updateProjectionMatrix();
    if (m === 'exterior'){ controls.enabled = true; applyCut(3, false); const v = VIEWS[activeView]; if (instant){ camera.position.set(...v.p); controls.target.set(...v.t); controls.update(); } else flyTo(v.p, v.t); }
    if (m === 'floors'){ controls.enabled = true; applyCut(floor, false); const p = floorPreset(floor); flyTo(p.p, p.t); }
    if (m === 'plan'){ controls.enabled = false; applyCut(floor, true); fitPlan(); resetPlan(); placePlan(); }
  }
  renderPanel();
}
function setFloor(L){
  floor = L; activeArea = null;
  if (mode === 'exterior') mode = 'floors';
  if (mode === 'floors'){ applyCut(L, false); const p = floorPreset(L); flyTo(p.p, p.t); }
  else if (mode === 'plan'){ applyCut(L, true); placePlan(); }
  else if (mode === 'walk'){ teleport(...TELE[L]); }
  renderPanel();
}
function focusArea(a){
  activeArea = a;
  if (mode === 'floors'){ const p = areaPreset(a); flyTo(p.p, p.t, 1.0); }
  else if (mode === 'plan'){ plan.zoom = Math.max(plan.zoom, 1.7); const p = ppm(); plan.cx = a.cx + (canvas.clientWidth > 760 ? 170/p : 0); plan.cz = a.cz; placePlan(); }
  else if (mode === 'walk'){ walkToArea(a); }
  renderPanel();
}

document.querySelectorAll('#modes button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
const panel = $('#panel');
function setCollapsed(c){ panel.classList.toggle('collapsed', c); $('#panelBody').hidden = c; $('#collapse').setAttribute('aria-expanded', String(!c)); $('#collapse').setAttribute('aria-label', c ? 'Show panel' : 'Hide panel'); }
$('#collapse').addEventListener('click', () => setCollapsed(!panel.classList.contains('collapsed')));

/* ---------- input: walk look, plan pan/zoom, joystick, keys ---------- */
const ptrs = new Map(); let pinch0 = 0, zoom0 = 1;
canvas.addEventListener('pointerdown', e => {
  if (mode !== 'walk' && mode !== 'plan') return;
  canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (ptrs.size === 2){ const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a.x-b.x, a.y-b.y); zoom0 = plan.zoom; }
  canvas.focus({preventScroll:true});
});
canvas.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (mode === 'walk'){
    const k = e.pointerType === 'touch' ? .0055 : .0036;
    W.yaw -= dx*k; W.pitch = Math.max(-1.3, Math.min(1.3, W.pitch - dy*k));
  } else if (mode === 'plan'){
    if (ptrs.size >= 2){ const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.x-b.x, a.y-b.y); if (pinch0) plan.zoom = Math.max(.6, Math.min(5, zoom0*d/pinch0)); }
    else { const q = ppm(); plan.cx -= dx/q; plan.cz -= dy/q; }
    placePlan();
  }
});
const endPtr = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch0 = 0; };
canvas.addEventListener('pointerup', endPtr); canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('wheel', e => { if (mode !== 'plan') return; e.preventDefault(); plan.zoom = Math.max(.6, Math.min(5, plan.zoom*Math.exp(-e.deltaY*.0015))); placePlan(); }, {passive:false});
const joyEl = $('#joy'), knob = joyEl.querySelector('.knob'); let joyId = null;
function joyMove(e){ const r = joyEl.getBoundingClientRect(), R = r.width/2 - 10; let dx = e.clientX - (r.left + r.width/2), dy = e.clientY - (r.top + r.height/2); const d = Math.hypot(dx, dy); if (d > R){ dx *= R/d; dy *= R/d; } joy.x = dx/R; joy.y = dy/R; knob.style.transform = `translate(${dx}px,${dy}px)`; }
joyEl.addEventListener('pointerdown', e => { joyId = e.pointerId; joyEl.setPointerCapture(e.pointerId); joyMove(e); e.stopPropagation(); });
joyEl.addEventListener('pointermove', e => { if (e.pointerId === joyId) joyMove(e); });
const joyEnd = e => { if (e.pointerId !== joyId) return; joyId = null; joy.x = joy.y = 0; knob.style.transform = ''; };
joyEl.addEventListener('pointerup', joyEnd); joyEl.addEventListener('pointercancel', joyEnd);
window.addEventListener('keydown', e => {
  if (mode !== 'walk') return;
  if (['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','ShiftLeft','ShiftRight'].includes(e.code)){ keys[e.code] = true; if (e.code.startsWith('Arrow')) e.preventDefault(); }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

/* ---------- resize & loop ---------- */
function resize(){
  const w = canvas.clientWidth, h = canvas.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix();
  fitPlan(); if (mode === 'plan') placePlan();
}
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas);
resize();

let last = performance.now(), whereT = 0, lastLevel = -1;
function frame(now){
  const dt = Math.min(.05, (now - last)/1000); last = now;
  if (mode === 'walk'){
    stepWalk(dt);
    whereT -= dt;
    if (whereT <= 0){
      whereT = .25; const [a, b] = whereAmI(); const el = $('#where');
      const html = `<small>${b}</small>${a}`; if (el.innerHTML !== html) el.innerHTML = html;
      const L = levelOf(W.y); if (L !== lastLevel){ lastLevel = L; floor = L; renderPanel(); }
    }
  } else if (tween) stepTween(now);
  else if (mode !== 'plan'){ controls.update(); if (camera.position.y < .4){ camera.position.y = .4; } }
  const cam = mode === 'plan' ? ortho : camera;
  renderer.render(scene, cam);
  updateLabels(cam);
  requestAnimationFrame(frame);
}

setMode('exterior', true);
renderer.shadowMap.needsUpdate = true;
requestAnimationFrame(frame);

/* redraw signs once the web fonts are ready */
if (document.fonts && document.fonts.load){
  Promise.all([
    document.fonts.load(`800 100px "Bricolage Grotesque"`), document.fonts.load(`500 32px "IBM Plex Sans"`),
    document.fonts.load(`700 50px "Kantumruy Pro"`, 'ហាងកាហ្វេ')
  ]).then(() => [tSign, tBlade, tMenu, tScreen, tTv].forEach(redraw)).catch(() => {});
}
})();
</script>
